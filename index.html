<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>影像作品集</title>
<meta content="影像作品集 —— 产品宣传 · 校园内容 · AIGC" name="description">
<meta content="影像作品集" property="og:title">
<meta content="影像作品集 —— 产品宣传 · 校园内容 · AIGC" property="og:description">
<meta content="https://3149779635-ctrl.github.io/linshen-portfolio/cover-yufei.jpg" property="og:image">
<meta content="website" property="og:type">
<meta content="summary_large_image" name="twitter:card">
<style>
/* ============ 基础 ============ */
:root{
  --bg:#f4f2ed;
  --ink:#141413;
  --sub:#8a867c;
  --line:#e2ded4;
  --accent:#e2452b;
  --maxw:1340px;
  --pad:clamp(20px,5vw,64px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.idx{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.08em;margin-right:10px}

/* ============ 导航 ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:flex-end;
  padding:20px var(--pad);
  transition:background .3s,border-color .3s;
}
.nav.scrolled{background:rgba(244,242,237,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .brand{font-weight:700;font-size:16px;letter-spacing:.02em}
.nav nav{display:flex;gap:34px}
.nav nav a{
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);
  position:relative;padding-bottom:3px;transition:color .25s;
}
.nav nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--ink);transition:width .3s}
.nav nav a:hover{color:var(--ink)}
.nav nav a:hover::after{width:100%}

/* ============ Hero ============ */
.hero{
  min-height:100svh;max-width:var(--maxw);margin:0 auto;
  padding:130px var(--pad) 40px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.hero__meta{
  display:flex;gap:26px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);
  animation:fadeUp .9s .1s both;
}
.hero__meta span{display:flex;align-items:center;gap:26px}
.hero__meta span:not(:first-child)::before{content:"—";color:var(--line)}
.hero__title{
  font-size:clamp(66px,15vw,196px);
  line-height:.96;letter-spacing:-.045em;font-weight:800;
  margin:auto 0;
}
.hero__title em{font-style:normal;display:block;animation:fadeUp 1s .15s both}
.hero__title span{display:block;font-weight:300;color:#c3bdb0;letter-spacing:-.03em;animation:fadeUp 1s .28s both}
.hero__foot{
  display:flex;justify-content:space-between;align-items:flex-end;gap:28px;
  border-top:1px solid var(--line);padding-top:26px;
  animation:fadeUp 1s .4s both;
}
.hero__foot p{max-width:400px;font-size:15px;color:var(--sub)}
.scroll{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);white-space:nowrap}

/* ============ 作品 ============ */
.works{padding:110px 0 100px;border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:44px}
.sec-head h2{font-size:clamp(26px,3.6vw,42px);font-weight:700;letter-spacing:-.02em}
.sec-head .count{font-size:12px;letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
.filters{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:44px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.filter{
  background:none;border:none;font:inherit;font-size:14px;color:var(--sub);
  cursor:pointer;padding:0 0 4px;border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.filter:hover{color:var(--ink)}
.filter.is-active{color:var(--ink);border-bottom-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:58px 34px}
.card{cursor:pointer;position:relative;animation:cardIn .6s both;animation-delay:var(--d,0ms)}
.card__cover{position:relative;aspect-ratio:16/10;overflow:hidden;background:#ddd}
.card__bg{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .card__bg{transform:scale(1.055)}
.card__video{width:100%;height:100%;object-fit:cover;background:#0c0c0c;z-index:0}
.card__cover::before{content:"";position:absolute;z-index:1;width:58%;padding-top:58%;border:1px solid rgba(255,255,255,.17);border-radius:50%;top:-24%;right:-8%;pointer-events:none}
.card__glyph{position:absolute;z-index:1;right:12px;bottom:-16px;font-size:clamp(88px,11vw,148px);font-weight:800;line-height:.78;letter-spacing:-.05em;color:rgba(255,255,255,.14);pointer-events:none;user-select:none}
.card__cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.02) 42%,rgba(0,0,0,.40));pointer-events:none}
.card__num,.card__platform{
  position:absolute;top:15px;z-index:2;font-size:11px;letter-spacing:.14em;
  color:rgba(255,255,255,.92);text-transform:uppercase;
}
.card__num{left:17px}
.card__platform{right:17px}
.card__play{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.card__play i{
  width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.96);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.72);transition:opacity .35s,transform .35s;
}
.card:hover .card__play i{opacity:1;transform:scale(1)}
.card__play i::after{
  content:"";margin-left:5px;
  border-left:17px solid var(--ink);border-top:11px solid transparent;border-bottom:11px solid transparent;
}
.card__body{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:16px}
.card__title{font-size:20px;font-weight:600;letter-spacing:-.01em;transition:color .25s}
.card:hover .card__title{color:var(--accent)}
.card__meta{font-size:12.5px;color:var(--sub);letter-spacing:.04em;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0}
.empty strong{display:block;font-size:20px;color:var(--ink);font-weight:600;margin-bottom:8px}

/* ============ 模态框 ============ */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal.is-open{display:flex}
.modal__backdrop{position:absolute;inset:0;background:rgba(12,12,12,.82);backdrop-filter:blur(6px);animation:fade .3s both}
.modal__dialog{position:relative;width:min(1000px,100%);background:#111;color:#fff;animation:pop .35s both}
.modal__close{
  position:absolute;top:-46px;right:0;z-index:3;background:none;border:none;color:#fff;
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.8;
}
.modal__close:hover{opacity:1}
.modal__frame{position:relative;aspect-ratio:16/9;background:#000}
.modal__frame iframe,.modal__frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.modal__info{padding:22px 26px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.modal__info h3{font-size:20px;font-weight:600}
.modal__info .sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.modal__frame.is-portrait{aspect-ratio:auto;height:min(78vh,660px);width:auto;margin:0 auto}

/* ============ 动画 ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media(max-width:760px){
  .nav{padding:16px var(--pad)}
  .nav nav{gap:16px}
  .nav nav a{font-size:10.5px;letter-spacing:.05em}
  .hero{padding-top:110px}
  .hero__meta{gap:14px;font-size:10px}
  .hero__meta span{gap:14px}
  .hero__foot{flex-direction:column;align-items:flex-start;gap:14px}
  .grid{grid-template-columns:1fr;gap:44px}
  .sec-head{flex-direction:column;gap:8px;align-items:flex-start}
  .filters{gap:18px}
  .modal{padding:16px}
  .modal__close{top:-40px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<!-- 导航 -->
<header class="nav" id="nav">
  <nav>
    <a href="#works">作品</a>
  </nav>
</header>

<!-- Hero -->
<section class="hero" id="top">
  <div class="hero__meta">
    <span id="metaSchool">广东轻工职业技术大学</span>
    <span id="metaMajor">软件技术 / AI 新媒体工坊班</span>
    <span id="metaStatus">大三在读</span>
  </div>
  <h1 class="hero__title">
    <em>我的</em>
    <span>作品集</span>
  </h1>
  <div class="hero__foot">
    <p id="heroLead">大学三年的影像记录——产品宣传、校园视频号、习概研练、独立站与 AIGC 实验，点开任意作品即可观看。</p>
    <span class="scroll">Scroll ↓</span>
  </div>
</section>

<main>
  <!-- 作品 -->
  <section class="works" id="works">
    <div class="wrap">
      <div class="sec-head reveal">
        <h2><span class="idx">(01)</span>Selected Works</h2>
        <span class="count" id="workCount">—</span>
      </div>
      <div class="filters reveal" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<!-- 播放模态框 -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-label="视频播放" aria-modal="true">
    <button class="modal__close" data-close>Close ✕</button>
    <div class="modal__frame" id="modalFrame"></div>
    <div class="modal__info">
      <div>
        <h3 id="modalTitle"></h3>
        <div class="sub" id="modalSub"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 数据（改这里即可） =================
   platform: youtube | bilibili | vimeo | local
   videoId : youtube 填视频ID / bilibili 填BV号 / vimeo 填数字ID
             local 填本地视频路径，如 "videos/我的作品.mp4"（文件与本页放在同一目录）
   cover   : 可选，作品封面图地址；不填则用设计化渐变封面
======================================================= */
var DATA = {
  profile:{
    lead:"大三在读，喜欢用影像记录校园、产品，以及脑子里冒出来的奇想。",
    meta:[["身份","大三在读"],["方向","产品宣传 · 校园内容 · AIGC"]]
  },
  categories:["产品宣传","学校视频号","习概研练","独立站介绍","AIGC 视频","个人生活"],
  works:[
    { id:"1", title:"YUFEI 椅子", category:"产品宣传", platform:"bilibili", videoId:"BV1SYxB6sEWb",
      cover:"cover-yufei.jpg" },
    { id:"2", title:"双肩包", category:"产品宣传", platform:"bilibili", videoId:"BV1bYxB6sE6T",
      cover:"cover-backpack.jpg" },
    { id:"3", title:"工坊班课程花絮", category:"学校视频号", platform:"bilibili", videoId:"BV18YxB6sEKx",
      cover:"cover-workshop.jpg" },
    { id:"4", title:"奶龙大战豆包", category:"AIGC 视频", platform:"bilibili", videoId:"BV18hxB6dELe",
      cover:"cover-nailong.jpg" },
    { id:"5", title:"寻迹三大", category:"习概研练", platform:"bilibili", videoId:"BV1eWxB6hEF8",
      cover:"cover-xunji.jpg" },
    { id:"6", title:"墨西哥视频二维码独立站", category:"独立站介绍", platform:"bilibili", videoId:"BV18hxB6dEbA",
      cover:"cover-stand.jpg" },
    { id:"7", title:"墨西哥视频二维码产品工作台", category:"独立站介绍", platform:"bilibili", videoId:"BV18hxB6dErZ",
      cover:"cover-workbench.jpg" },
    { id:"8", title:"个人生活 01", category:"个人生活", platform:"bilibili", videoId:"BV1a4xB6bEd5",
      cover:"cover-life01.jpg" },
    { id:"9", title:"个人生活 02", category:"个人生活", platform:"bilibili", videoId:"BV1a4xB6bEdK",
      cover:"cover-life02.jpg" },
    { id:"10", title:"个人生活 03", category:"个人生活", platform:"bilibili", videoId:"BV1Y4xB6bEA7",
      cover:"cover-life03.jpg" },
    { id:"11", title:"个人生活 04", category:"个人生活", platform:"bilibili", videoId:"BV1a4xB6bEfc",
      cover:"cover-life04.jpg" },
    { id:"12", title:"个人生活 05", category:"个人生活", platform:"bilibili", videoId:"BV1a4xB6bEiM",
      cover:"cover-life05.jpg" },
    { id:"13", title:"个人生活 06", category:"个人生活", platform:"bilibili", videoId:"BV1YxxB6FEaF",
      cover:"cover-life06.jpg" },
    { id:"14", title:"个人生活 07", category:"个人生活", platform:"bilibili", videoId:"BV1YxxB6FEnL",
      cover:"cover-life07.jpg" }
  ]
};

(function(){
  var P = DATA.profile, WORKS = DATA.works, CATS = DATA.categories;
  var ALL_CAT = "全部";
  var current = ALL_CAT, currentOpenId = null;

  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function pad(n){return n<10?"0"+n:""+n;}
  function updateCount(){document.getElementById("workCount").textContent="("+pad(WORKS.length)+" Projects)";}
  function plabel(w){
    if(w.label) return w.label;
    return {youtube:"YouTube",bilibili:"Bilibili",vimeo:"Vimeo",local:"Video"}[w.platform]||w.platform;
  }

  function embed(w){
    if(w.platform==="youtube") return "https://www.youtube.com/embed/"+encodeURIComponent(w.videoId)+"?autoplay=1&rel=0&modestbranding=1";
    if(w.platform==="bilibili") return "https://player.bilibili.com/player.html?bvid="+encodeURIComponent(w.videoId)+"&page=1&high_quality=1&danmaku=0&autoplay=1";
    if(w.platform==="vimeo") return "https://player.vimeo.com/video/"+encodeURIComponent(w.videoId)+"?autoplay=1&title=0&byline=0&portrait=0";
    return "";
  }

  /* ============ 资料区（头部） ============ */
  if(P){
    var hl=document.getElementById("heroLead");
    if(hl) hl.textContent = P.lead || hl.textContent;
    // 头部 meta
    if(Array.isArray(P.meta)){
      var school = (P.meta.find(function(m){return m[0]==="学校";})||[])[1];
      var major  = (P.meta.find(function(m){return m[0]==="专业";})||[])[1];
      var status = (P.meta.find(function(m){return m[0]==="身份";})||[])[1];
      var eS=document.getElementById("metaSchool"), eM=document.getElementById("metaMajor"), eT=document.getElementById("metaStatus");
      if(school && eS) eS.textContent = school;
      if(major  && eM) eM.textContent  = major;
      if(status && eT) eT.textContent = status;
    }
  }

  /* ============ 筛选 ============ */
  var filtersEl = document.getElementById("filters");
  function renderFilters(){
    filtersEl.innerHTML = [ALL_CAT].concat(CATS).map(function(c){
      return '<button class="filter'+(c===current?" is-active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+"</button>";
    }).join("");
    Array.prototype.forEach.call(filtersEl.querySelectorAll(".filter"),function(btn){
      btn.addEventListener("click",function(){
        current = btn.getAttribute("data-cat");
        renderFilters(); render();
      });
    });
  }

  /* ============ 网格 ============ */
  var gridEl = document.getElementById("grid");
  function render(){
    if(!WORKS.length){
      gridEl.innerHTML = '<div class="empty"><strong>作品即将上线</strong>更多影像作品正在整理中，敬请期待。</div>';
      return;
    }
    var list = (current===ALL_CAT) ? WORKS : WORKS.filter(function(w){return w.category===current;});
    if(!list.length){gridEl.innerHTML='<p class="empty">该分类下暂无作品。</p>';return;}
    gridEl.innerHTML = list.map(function(w,i){
      var cover;
      if(w.cover){
        cover = '<div class="card__bg" style="background-image:url(\''+esc(w.cover)+'\');background-size:cover;background-position:center"></div>';
      }else if(w.platform==="local"){
        cover = '<video class="card__bg card__video" preload="metadata" muted playsinline src="'+esc(w.videoId)+'"></video>';
      }else{
        cover = '<div class="card__bg" style="background:'+w.gradient+'"></div><span class="card__glyph">'+esc((w.title||"·").charAt(0))+'</span>';
      }
      return '<article class="card" data-id="'+w.id+'" style="--d:'+(i*70)+'ms">'+
        '<div class="card__cover">'+
          cover+
          '<span class="card__num">'+pad(i+1)+'</span>'+
          '<span class="card__platform">'+plabel(w)+'</span>'+
          '<span class="card__play"><i></i></span>'+
        '</div>'+
        '<div class="card__body">'+
          '<h3 class="card__title">'+esc(w.title)+'</h3>'+
          '<div class="card__meta">'+esc(w.category)+(w.year?" · "+w.year:"")+'</div>'+
        '</div>'+
      '</article>';
    }).join("");
    Array.prototype.forEach.call(gridEl.querySelectorAll(".card"),function(card){
      var id = card.getAttribute("data-id");
      var w = WORKS.filter(function(x){return x.id===id;})[0];
      card.addEventListener("click",function(){ if(w) openModal(w); });
    });
    initCovers();
  }

  /* 本地视频封面：seek 到视频自身更具代表性的画面（避开黑场开头，仍用视频真实帧） */
  function initCovers(){
    Array.prototype.forEach.call(gridEl.querySelectorAll(".card__video"),function(v){
      var seeked=false;
      function showFrame(){
        if(seeked) return; seeked=true;
        try{
          var d = isFinite(v.duration) && v.duration>0 ? v.duration : 4;
          v.currentTime = Math.min(2, Math.max(0.5, d*0.08));
        }catch(e){}
      }
      v.addEventListener("loadedmetadata",showFrame);
      v.addEventListener("loadeddata",showFrame);
    });
  }

  /* ============ 模态框 ============ */
  var modal=document.getElementById("modal"), frame=document.getElementById("modalFrame");
  function openModal(w){
    currentOpenId = w.id;
    frame.classList.remove("is-portrait");
    frame.style.width = ""; frame.style.height = "";
    if(w.platform==="local"){
      var mv=document.createElement("video");
      mv.src=w.videoId; mv.controls=true; mv.autoplay=true; mv.playsInline=true;
      mv.setAttribute("playsinline","");
      mv.setAttribute("webkit-playsinline","");
      frame.appendChild(mv);
      mv.addEventListener("loadedmetadata",function(){
        if(mv.videoHeight > mv.videoWidth){
          var h = Math.min(window.innerHeight*0.78, 660);
          frame.classList.add("is-portrait");
          frame.style.height = h+"px";
          frame.style.width = Math.round(h * mv.videoWidth / mv.videoHeight)+"px";
        }
      });
      var pp=mv.play(); if(pp&&pp.catch) pp.catch(function(){});
    }else{
      frame.innerHTML = '<iframe src="'+embed(w)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
    }
    document.getElementById("modalTitle").textContent = w.title;
    document.getElementById("modalSub").textContent = [w.category,w.client,w.year].filter(Boolean).join(" · ");
    modal.classList.add("is-open"); modal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  }
  function closeModal(){
    modal.classList.remove("is-open"); modal.setAttribute("aria-hidden","true");
    document.body.style.overflow=""; frame.innerHTML=""; currentOpenId=null;
    frame.classList.remove("is-portrait");
    frame.style.width=""; frame.style.height="";
  }
  Array.prototype.forEach.call(modal.querySelectorAll("[data-close]"),function(el){el.addEventListener("click",closeModal);});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});

  /* ============ 滚动 ============ */
  var nav=document.getElementById("nav");
  window.addEventListener("scroll",function(){nav.classList.toggle("scrolled",window.scrollY>20);},{passive:true});

  /* ============ 进场动画 ============ */
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});
    },{threshold:.12});
    Array.prototype.forEach.call(document.querySelectorAll(".reveal"),function(el){io.observe(el);});
  }else{
    Array.prototype.forEach.call(document.querySelectorAll(".reveal"),function(el){el.classList.add("in");});
  }

  /* ============ 初始化 ============ */
  current = ALL_CAT;
  renderFilters();
  updateCount();
  render();
})();
</script>
</body>
</html>
