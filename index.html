<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>影像作品集</title>
<meta content="影像作品集 —— 产品宣传 · 校园内容 · AIGC" name="description">
<meta content="影像作品集" property="og:title">
<meta content="影像作品集 —— 产品宣传 · 校园内容 · AIGC" property="og:description">
<meta content="https://linfilm.github.io/xixi-portfolio/cover-yufei.jpg" property="og:image">
<meta content="website" property="og:type">
<meta content="summary_large_image" name="twitter:card">
<style>
/* ============ 设计 token ============ */
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --ink:#1d1d1f;
  --sub:#6e6e73;
  --sub-2:#86868b;
  --line:rgba(0,0,0,.08);
  --accent:#e2452b;
  --maxw:1340px;
  --pad:clamp(20px,5vw,64px);
  --r-card:18px;
  --r-lg:26px;
  --shadow-1:0 2px 8px rgba(0,0,0,.06);
  --shadow-2:0 14px 40px rgba(0,0,0,.13);
  --shadow-3:0 30px 80px rgba(0,0,0,.4);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:52px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  line-height:1.5;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.idx{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.02em;margin-right:10px}

/* ============ 导航 ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  height:var(--nav-h);padding:0 var(--pad);
  border-bottom:.5px solid transparent;
  transition:background .35s var(--ease),border-color .35s var(--ease);
}
.nav.scrolled{
  background:rgba(245,245,247,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom-color:rgba(0,0,0,.07);
}
.nav__brand{font-size:14px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.nav__brand::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.nav nav{display:flex;gap:26px}
.nav nav a{font-size:13.5px;color:var(--sub);transition:color .22s var(--ease)}
.nav nav a:hover{color:var(--ink)}

/* ============ Hero ============ */
.hero{
  min-height:100svh;max-width:var(--maxw);margin:0 auto;
  padding:calc(var(--nav-h) + 72px) var(--pad) 44px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.hero__meta{
  display:flex;gap:12px;flex-wrap:wrap;
  font-size:13px;color:var(--sub);
  animation:fadeUp .8s var(--ease) .05s both;
}
.hero__meta span{display:flex;align-items:center;gap:12px}
.hero__meta span:not(:first-child)::before{content:"";width:3px;height:3px;border-radius:50%;background:#c7c7cc}
.hero__center{margin:auto 0}
.hero__title{
  font-size:clamp(62px,13.5vw,188px);
  line-height:.94;letter-spacing:-.04em;font-weight:700;
  padding:28px 0;margin:0;
}
.hero__title em{font-style:normal;display:block;animation:fadeUp .9s var(--ease) .12s both}
.hero__title span{display:block;font-weight:300;color:#c7c7cc;letter-spacing:-.03em;animation:fadeUp .9s var(--ease) .22s both}

/* 姓名 + 简历入口 */
.hero__id{
  display:flex;flex-direction:column;align-items:flex-start;gap:20px;
  padding-top:26px;animation:fadeUp .9s var(--ease) .28s both;
}
.hero__id-name{display:flex;align-items:baseline;font-size:clamp(16px,1.5vw,19px);color:var(--sub-2)}
.hero__id-name b{font-weight:600;color:var(--ink);letter-spacing:.1em}
.hero__id-name .en{font-weight:400;color:var(--sub-2);letter-spacing:.1em}
.hero__id-name .dash{color:#c7c7cc;letter-spacing:0;margin:0 .1em;font-weight:400}
.hero__resume{
  display:inline-flex;align-items:center;gap:9px;
  height:42px;padding:0 18px;border-radius:999px;
  background:var(--surface);border:1px solid rgba(0,0,0,.1);
  font-size:14px;font-weight:500;color:var(--ink);letter-spacing:-.01em;
  box-shadow:var(--shadow-1);-webkit-tap-highlight-color:transparent;
  transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),
             box-shadow .3s var(--ease),transform .4s var(--spring);
}
.hero__resume:hover{background:var(--ink);border-color:var(--ink);color:#fff;transform:translateY(-1px);box-shadow:var(--shadow-2)}
.hero__resume:active{transform:scale(.98)}
.hero__resume .tag{
  font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.06);color:var(--sub);
  transition:background .3s var(--ease),color .3s var(--ease);
}
.hero__resume:hover .tag{background:rgba(255,255,255,.16);color:#fff}
.hero__resume .arrow{font-size:13px;transition:transform .4s var(--spring)}
.hero__resume:hover .arrow{transform:translate(2px,-2px)}
.hero__foot{
  display:flex;justify-content:space-between;align-items:flex-end;gap:32px;
  border-top:.5px solid var(--line);padding-top:28px;
  animation:fadeUp .9s var(--ease) .32s both;
}
.hero__foot p{max-width:480px;font-size:17px;color:var(--sub);letter-spacing:-.01em;text-wrap:pretty}
.scroll{
  font-size:13px;color:var(--sub-2);white-space:nowrap;
  display:flex;align-items:center;gap:8px;
}
.scroll::after{content:"↓";font-size:14px;animation:bob 1.9s ease-in-out infinite}

/* ============ 作品 ============ */
.works{padding:104px 0 120px;background:var(--surface)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:36px}
.sec-head h2{font-size:clamp(28px,3.4vw,42px);font-weight:700;letter-spacing:-.025em}
.sec-head .count{font-size:13px;color:var(--sub-2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
.filter{
  background:var(--surface);border:1px solid rgba(0,0,0,.08);border-radius:999px;
  padding:9px 18px;font:inherit;font-size:14px;color:var(--sub);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:color .22s var(--ease),border-color .22s,background .22s,box-shadow .22s,transform .34s var(--spring);
}
.filter:hover{color:var(--ink);border-color:rgba(0,0,0,.16);transform:translateY(-1px)}
.filter:active{transform:scale(.97)}
.filter.is-active{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* 移动端滑动提示：仅当分类条横向溢出且未滑动过时出现，划过即收起 */
.filter-hint{
  display:none;align-items:center;justify-content:flex-end;gap:7px;
  overflow:hidden;max-height:0;opacity:0;margin:0;
  font-size:12px;color:var(--sub);letter-spacing:.02em;
  transition:max-height .45s var(--ease),opacity .45s var(--ease),margin .45s var(--ease);
}
.filter-hint.is-visible{max-height:22px;opacity:1;margin:-30px 0 26px}
.filter-hint__arrow{position:relative;width:15px;height:10px;animation:hintNudge 1.9s var(--ease) infinite}
.filter-hint__arrow::before,.filter-hint__arrow::after{
  content:"";position:absolute;top:50%;width:6px;height:6px;border-radius:1px;
  border-top:1.4px solid currentColor;border-right:1.4px solid currentColor;
  transform:translateY(-50%) rotate(45deg);
}
.filter-hint__arrow::before{left:0;opacity:.45}
.filter-hint__arrow::after{left:5px}
@keyframes hintNudge{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(4px);opacity:1}}
@media(min-width:901px){.filter-hint{display:none!important}}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:44px 24px}
.card{
  cursor:pointer;position:relative;border-radius:var(--r-card);
  animation:cardIn .55s var(--ease) both;animation-delay:var(--d,0ms);
  transition:transform .38s var(--spring);
  -webkit-tap-highlight-color:transparent;
}
.card:hover,.card:focus-visible{transform:translateY(-6px)}
.card:active{transform:translateY(-2px) scale(.995)}
.card__cover{
  position:relative;aspect-ratio:16/10;overflow:hidden;
  border-radius:var(--r-card);background:#e8e8ed;
  box-shadow:var(--shadow-1);
  transition:box-shadow .38s var(--ease);
}
.card:hover .card__cover,.card:focus-visible .card__cover{box-shadow:var(--shadow-2)}
.card__img,.card__video,.card__bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background-position:center;background-size:cover;
  transition:transform .7s var(--ease);
}
.card:hover .card__img,.card:hover .card__video,.card:hover .card__bg{transform:scale(1.045)}
.card__glyph{
  position:absolute;z-index:1;right:12px;bottom:-8px;
  font-size:clamp(52px,6vw,84px);font-weight:700;line-height:.8;letter-spacing:-.04em;
  color:rgba(255,255,255,.2);pointer-events:none;user-select:none;
}
.card__cover::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 38%);
  opacity:.9;transition:opacity .38s var(--ease);
}
.card:hover .card__cover::after{opacity:.6}
.card__num{
  position:absolute;top:12px;left:14px;z-index:2;
  font-size:11px;font-weight:600;letter-spacing:.08em;color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.4);
}
.card__platform{
  position:absolute;top:10px;right:10px;z-index:2;
  font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.95);
  background:rgba(0,0,0,.32);border-radius:999px;padding:4px 9px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.card__play{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card__play i{
  width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.8);
  transition:opacity .3s var(--ease),transform .34s var(--spring);
}
.card:hover .card__play i,.card:focus-visible .card__play i{opacity:1;transform:scale(1)}
.card__play i::after{
  content:"";margin-left:4px;
  border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent;
}
.card__body{display:flex;flex-direction:column;gap:3px;padding-top:14px}
.card__title{font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--ink);transition:color .22s}
.card:hover .card__title{color:var(--accent)}
.card__meta{font-size:12.5px;color:var(--sub-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:72px 0}
.empty strong{display:block;font-size:19px;color:var(--ink);font-weight:600;margin-bottom:8px}

/* ============ 模态框 ============ */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:28px}
.modal.is-open{display:flex}
.modal__backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(24px) saturate(120%);
  backdrop-filter:blur(24px) saturate(120%);
  animation:fade .3s both;
}
.modal__dialog{
  position:relative;width:min(1000px,100%);
  background:#0d0d0d;color:#fff;
  border-radius:var(--r-lg);border:1px solid rgba(255,255,255,.12);
  overflow:hidden;box-shadow:var(--shadow-3);
  animation:pop .42s var(--spring) both;
}
.modal__frame{position:relative;aspect-ratio:16/9;background:#000}
.modal__frame iframe,.modal__frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.modal__frame.is-portrait{aspect-ratio:auto;height:min(78vh,660px);width:auto;margin:0 auto}
.modal__close{
  position:absolute;top:14px;right:14px;z-index:5;
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(20,20,20,.55);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#fff;font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .22s,transform .3s var(--spring);
}
.modal__close:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
.modal__close:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}
.modal__info{
  padding:20px 26px 24px;background:#0d0d0d;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
}
.modal__info h3{font-size:17px;font-weight:500;letter-spacing:-.01em}
.modal__info .sub{font-size:13px;color:var(--accent);margin-top:5px}

/* ============ 动画 ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .65s var(--ease),transform .65s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media(max-width:1180px){
  .grid{grid-template-columns:repeat(3,1fr);gap:38px 20px}
}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr);gap:32px 16px}
  .filters{
    flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;
    scroll-padding-left:var(--pad);
    margin-left:calc(-1 * var(--pad));margin-right:calc(-1 * var(--pad));
    padding:4px var(--pad) 10px;
    cursor:grab;
    /* 左右边缘渐隐：由 JS 按滚动位置更新，滑到头时对应一侧收起 */
    --fade-a:0px;--fade-b:22px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fade-a),#000 calc(100% - var(--fade-b)),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 var(--fade-a),#000 calc(100% - var(--fade-b)),transparent 100%);
  }
  .filters::-webkit-scrollbar{display:none;width:0;height:0}
  .filters.is-dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
  .filters.is-dragging .filter{pointer-events:none}
  .filter{flex:0 0 auto;scroll-snap-align:start;min-height:40px;padding:10px 17px}
  .filter-hint{display:flex}
  .hero__foot{flex-direction:column;align-items:flex-start;gap:14px}
  .works{padding:80px 0 96px}
}
@media(max-width:760px){
  .nav{height:48px}
  .nav nav{gap:18px}
  .nav nav a{font-size:13px}
  .hero{padding-top:calc(var(--nav-h) + 56px);padding-bottom:32px}
  .hero__meta{flex-direction:column;align-items:flex-start;gap:6px;font-size:12px}
  .hero__meta span{gap:0}
  .hero__meta span:not(:first-child)::before{display:none}
  .hero__title{padding:16px 0}
  .hero__id{gap:15px;padding-top:10px}
  .hero__resume{height:38px;padding:0 15px;font-size:13px}
  .hero__foot p{font-size:15.5px}
  .sec-head{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:28px}
  .modal{padding:16px}
  .modal__info{padding:16px 18px 18px}
  .modal__close{top:10px;right:10px;width:34px;height:34px;font-size:14px}
}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}
  .card__cover{border-radius:14px}
  .card__body{padding-top:10px;gap:2px}
  .card__title{font-size:13.5px}
  .card__meta{font-size:11px}
  .card__play i{width:42px;height:42px}
  .card__num{top:9px;left:10px;font-size:10px}
  .card__platform{top:8px;right:8px;font-size:9.5px;padding:3px 7px}
  .works{padding:64px 0 80px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<!-- 导航 -->
<header class="nav" id="nav">
  <a class="nav__brand" href="#top">影像作品集</a>
  <nav>
    <a href="#works">作品</a>
  </nav>
</header>

<!-- Hero -->
<section class="hero" id="top">
  <div class="hero__meta">
    <span id="metaSchool">广东轻工职业技术大学</span>
    <span id="metaMajor">软件技术 / AI 新媒体工坊班</span>
    <span id="metaStatus">大三在读</span>
  </div>
  <div class="hero__center">
    <h1 class="hero__title">
      <em>我的</em>
      <span>作品集</span>
    </h1>
    <div class="hero__id">
      <p class="hero__id-name">
        <span class="dash" aria-hidden="true">——</span><b>林亿翰</b><span class="en">/ Xixi</span><span class="dash" aria-hidden="true">——</span>
      </p>
      <a class="hero__resume" href="resume-linyihan.pdf" target="_blank" rel="noopener" type="application/pdf">
        <span>查看个人简历</span>
        <span class="tag">PDF</span>
        <span class="arrow" aria-hidden="true">↗</span>

  <div class="hero__foot">

    <span class="scroll">Scroll</span>

</section>

<main>
  <!-- 作品 -->
  <section class="works" id="works">
    <div class="wrap">
      <div class="sec-head reveal">

      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<!-- 播放模态框 -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-label="视频播放" aria-modal="true">
    <button class="modal__close" data-close aria-label="关闭">✕</button>
    <div class="modal__frame" id="modalFrame"></div>
    <div class="modal__info">
      <div>
        <h3 id="modalTitle"></h3>
        <div class="sub" id="modalSub"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 数据（改这里即可） =================
   platform: youtube | bilibili | vimeo | polyv | local
   videoId : youtube 填视频ID / bilibili 填BV号 / vimeo 填数字ID
             polyv 填保利威 vid / local 填本地视频路径，如 "videos/我的作品.mp4"
   cover   : 可选，作品封面图地址；不填则用设计化渐变封面
   portrait: 竖屏视频填 true；ratio 为宽高比（默认 0.75 = 3:4）
======================================================= */
var DATA = {
  profile:{
    lead:"喜欢用影像记录这世界的美好，以及脑子里冒出来的奇想。",
    meta:[["身份","大三在读"],["方向","产品宣传 · 校园内容 · AIGC"]]
  },
  categories:["产品宣传","学院视频号","AIGC创作","独立站","习概研练","个人创作"],
  works:[
    { id:"1", title:"YUFEI折叠椅", category:"产品宣传", platform:"polyv", videoId:"m393c21aea2f743bad8c31501b9b09e2_m",
      cover:"cover-yufei.jpg" },
    { id:"2", title:"Lec双肩包", category:"产品宣传", platform:"polyv", videoId:"m393c21aea26dcd0552834e1233b5b9e_m",
      cover:"cover-backpack.jpg" },
    { id:"3", title:"社媒运营课程花絮", category:"学院视频号", platform:"polyv", videoId:"m393c21aead4148f99e3faec4df67b53_m",
      cover:"cover-plv.jpg", portrait:true, ratio:0.75 },
    { id:"4", title:"奶龙大战豆包", category:"AIGC创作", platform:"polyv", videoId:"m393c21aea29f974cae8d198097432dc_m",
      cover:"cover-nailong.jpg" },
    { id:"5", title:"墨西哥视频二维码", category:"独立站", platform:"polyv", videoId:"m393c21aeaed121efd9d68fb5a0eceea_m",

    { id:"6", title:"视频二维码工作台", category:"独立站", platform:"polyv", videoId:"m393c21aeaed8bc3c8b74fd80a94ec69_m",
      cover:"cover-workbench.jpg" },
    { id:"7", title:"寻迹三大", category:"习概研练", platform:"polyv", videoId:"m393c21aeadc7b9513990815682baaf9_m",
      cover:"cover-xunji.jpg" },
    { id:"8", title:"plog", category:"个人创作", platform:"polyv", videoId:"m393c21aeacccd78b351f6bf7c42f595_m",
      cover:"cover-plog01.jpg", portrait:true, ratio:0.5625 },
    { id:"9", title:"plog", category:"个人创作", platform:"polyv", videoId:"m393c21aeaef5cb933c41e32b025c785_m",
      cover:"cover-plog02.jpg", portrait:true, ratio:0.75 },
    { id:"10", title:"view", category:"个人创作", platform:"polyv", videoId:"m393c21aea681e61517d4f9e650c38d2_m",
      cover:"cover-view.jpg", portrait:true, ratio:0.695 },
    { id:"11", title:"view", category:"个人创作", platform:"polyv", videoId:"m393c21aeaf9b759683e8f6a9cc7e054_m",
      cover:"cover-view2.jpg", portrait:true, ratio:0.5625 },
    { id:"12", title:"basketball", category:"个人创作", platform:"polyv", videoId:"m393c21aeacf6459aed21a838edaf468_m",
      cover:"cover-bb01.jpg", portrait:true, ratio:0.5625 },
    { id:"13", title:"basketball", category:"个人创作", platform:"polyv", videoId:"m393c21aeac0f46762f65aeac7943d87_m",
      cover:"cover-bb02.jpg", portrait:true, ratio:0.5625 },
    { id:"14", title:"game", category:"个人创作", platform:"polyv", videoId:"m393c21aead3b6222df575dc99c5a6f2_m",
      cover:"cover-game01.jpg" },
    { id:"15", title:"game", category:"个人创作", platform:"polyv", videoId:"m393c21aea552589087bac88e3c16653_m",
      cover:"cover-game02.jpg" }
  ]
};

(function(){
  var P = DATA.profile, WORKS = DATA.works, CATS = DATA.categories;
  var ALL_CAT = "全部";
  var current = ALL_CAT, currentOpenId = null;

  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function pad(n){return n<10?"0"+n:""+n;}
  function updateCount(){document.getElementById("workCount").textContent = WORKS.length ? "("+pad(WORKS.length)+" Projects)" : "—";}
  function plabel(w){
    if(w.label) return w.label;
    return {youtube:"YouTube",bilibili:"Bilibili",vimeo:"Vimeo",local:"Video",polyv:"Polyv"}[w.platform]||w.platform;
  }

  function embed(w){
    if(w.platform==="youtube") return "https://www.youtube.com/embed/"+encodeURIComponent(w.videoId)+"?autoplay=1&rel=0&modestbranding=1";
    if(w.platform==="bilibili") return "https://player.bilibili.com/player.html?bvid="+encodeURIComponent(w.videoId)+"&page=1&high_quality=1&danmaku=0&autoplay=1&hideCoverInfo=true";
    if(w.platform==="vimeo") return "https://player.vimeo.com/video/"+encodeURIComponent(w.videoId)+"?autoplay=1&title=0&byline=0&portrait=0";
    return "";
  }

  /* ============ 资料区（头部） ============ */
  if(P){
    var hl=document.getElementById("heroLead");
    if(hl) hl.textContent = P.lead || hl.textContent;
    // 头部 meta
    if(Array.isArray(P.meta)){
      var school = (P.meta.find(function(m){return m[0]==="学校";})||[])[1];
      var major  = (P.meta.find(function(m){return m[0]==="专业";})||[])[1];
      var status = (P.meta.find(function(m){return m[0]==="身份";})||[])[1];
      var eS=document.getElementById("metaSchool"), eM=document.getElementById("metaMajor"), eT=document.getElementById("metaStatus");
      if(school && eS) eS.textContent = school;
      if(major  && eM) eM.textContent  = major;
      if(status && eT) eT.textContent = status;
    }
  }

  /* ============ 筛选 ============ */
  var filtersEl = document.getElementById("filters");

  /* ---- 移动端：分类条横向滑动 ---- */
  function filterOverflow(){
    return filtersEl.scrollWidth - filtersEl.clientWidth;
  }
  /* 边缘渐隐：滑到起点/终点时对应一侧收起，避免「没内容了还在淡出」 */
  function paintFilterFade(){
    var max = filterOverflow();
    if(max <= 4){ filtersEl.style.setProperty("--fade-a","0px"); filtersEl.style.setProperty("--fade-b","0px"); return; }
    filtersEl.style.setProperty("--fade-a", filtersEl.scrollLeft > 4 ? "22px" : "0px");
    filtersEl.style.setProperty("--fade-b", filtersEl.scrollLeft < max - 4 ? "22px" : "0px");
  }
  /* 滑动提示：分类条真的溢出、并且用户还没滑过时才出现；划过一次就不再打扰 */
  var hintEl = document.getElementById("filterHint");
  var hintTimer = null, hintDismissed = false;
  function dismissFilterHint(){
    if(hintDismissed) return;
    hintDismissed = true;
    clearTimeout(hintTimer);
    if(hintEl) hintEl.classList.remove("is-visible");
  }
  function syncFilterHint(){
    if(!hintEl) return;
    var show = !hintDismissed &&
               filtersEl.style.display !== "none" &&
               filterOverflow() > 12 &&
               filtersEl.scrollLeft <= 12;
    if(!show){ hintEl.classList.remove("is-visible"); return; }
    hintEl.classList.add("is-visible");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(dismissFilterHint, 9000);
  }
  filtersEl.addEventListener("scroll",function(){
    if(filtersEl.scrollLeft > 12) dismissFilterHint();
  },{passive:true});

  /* 把选中项滑到可视区中间（不居中页面，只管横向） */  function revealActiveChip(smooth){
    var act = filtersEl.querySelector(".filter.is-active");
    if(!act || filterOverflow() <= 4) return;
    var fr = filtersEl.getBoundingClientRect(), ar = act.getBoundingClientRect();
    var target = filtersEl.scrollLeft + (ar.left - fr.left) - (filtersEl.clientWidth - ar.width)/2;
    target = Math.max(0, Math.min(target, filterOverflow()));
    if(Math.abs(target - filtersEl.scrollLeft) < 2) return;
    if(smooth && filtersEl.scrollTo){
      filtersEl.scrollTo({left:target, behavior:"smooth"});
    }else{
      filtersEl.scrollLeft = target;
    }
  }
  /* 鼠标拖拽（触摸端交给系统原生惯性滚动，不接管） */
  (function enableFilterDrag(){
    var down=false, startX=0, startLeft=0, moved=false, pid=null, suppress=false;
    filtersEl.addEventListener("pointerdown",function(e){
      if(e.pointerType === "touch" || e.button !== 0) return;
      down=true; moved=false; startX=e.clientX; startLeft=filtersEl.scrollLeft; pid=e.pointerId;
    });
    filtersEl.addEventListener("pointermove",function(e){
      if(!down) return;
      var dx = e.clientX - startX;
      if(!moved && Math.abs(dx) > 6){
        moved=true;
        filtersEl.classList.add("is-dragging");
        if(filtersEl.setPointerCapture && pid !== null){ try{ filtersEl.setPointerCapture(pid); }catch(err){} }
      }
      if(!moved) return;
      e.preventDefault();
      filtersEl.scrollLeft = startLeft - dx;
    },{passive:false});
    function stop(){
      if(!down) return;
      down=false;
      filtersEl.classList.remove("is-dragging");
      if(moved){ suppress=true; setTimeout(function(){ suppress=false; },260); }
      moved=false; pid=null;
    }
    filtersEl.addEventListener("pointerup",stop);
    filtersEl.addEventListener("pointercancel",stop);
    window.addEventListener("pointerup",function(){ if(down) stop(); });
    /* 拖拽结束后不要误触发分类切换 */
    filtersEl.addEventListener("click",function(e){
      if(suppress){ e.preventDefault(); e.stopPropagation(); }
    },true);
    /* 键盘 Tab 到某个分类时，把它带进可视区 */
    filtersEl.addEventListener("focusin",function(e){
      var t=e.target;
      if(!t || !t.classList || !t.classList.contains("filter")) return;
      var fr=filtersEl.getBoundingClientRect(), ar=t.getBoundingClientRect();
      if(ar.left < fr.left + 8 || ar.right > fr.right - 8){
        filtersEl.scrollLeft += (ar.left - fr.left) - 16;
      }
    });
    filtersEl.addEventListener("scroll",paintFilterFade,{passive:true});
  })();
  var fadeRaf=null;
  window.addEventListener("resize",function(){
    if(fadeRaf) cancelAnimationFrame(fadeRaf);
    fadeRaf = requestAnimationFrame(function(){ paintFilterFade(); syncFilterHint(); });
  });

  /* 只列出真正有作品的分类：先按 categories 的顺序，再补上数据里出现但未登记的分类 */
  function activeCats(){
    var seen={}, out=[];
    CATS.forEach(function(c){
      if(WORKS.some(function(w){return w.category===c;}) && !seen[c]){ seen[c]=1; out.push(c); }
    });
    WORKS.forEach(function(w){
      if(w.category && !seen[w.category]){ seen[w.category]=1; out.push(w.category); }
    });
    return out;
  }
  function renderFilters(){
    if(!WORKS.length){ filtersEl.innerHTML=""; filtersEl.style.display="none"; return; }
    var cats = activeCats();
    if(cats.length < 2){ filtersEl.innerHTML=""; filtersEl.style.display="none"; return; }
    filtersEl.style.display="";
    if(cats.indexOf(current) === -1) current = ALL_CAT;
    var prevScroll = filtersEl.scrollLeft;
    filtersEl.innerHTML = [ALL_CAT].concat(cats).map(function(c){
      return '<button class="filter'+(c===current?" is-active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+"</button>";
    }).join("");
    filtersEl.scrollLeft = prevScroll;
    Array.prototype.forEach.call(filtersEl.querySelectorAll(".filter"),function(btn){
      btn.addEventListener("click",function(){
        current = btn.getAttribute("data-cat");
        renderFilters(); render();
      });
    });
    requestAnimationFrame(function(){ paintFilterFade(); revealActiveChip(true); syncFilterHint(); });
  }

  /* ============ 网格 ============ */
  var gridEl = document.getElementById("grid");
  function render(){
    if(!WORKS.length){
      gridEl.innerHTML = '<div class="empty"><strong>作品即将上线</strong>更多影像作品正在整理中，敬请期待。</div>';
      return;
    }
    var list = (current===ALL_CAT) ? WORKS : WORKS.filter(function(w){return w.category===current;});
    if(!list.length){gridEl.innerHTML='<p class="empty">该分类下暂无作品。</p>';return;}
    gridEl.innerHTML = list.map(function(w,i){
      var cover;
      if(w.cover){
        var lazy = i < 8 ? "" : ' loading="lazy"';
        cover = '<img class="card__img" src="'+esc(w.cover)+'" alt="'+esc(w.title)+' 封面"'+lazy+' decoding="async">';
      }else if(w.platform==="local"){
        cover = '<video class="card__video" preload="metadata" muted playsinline src="'+esc(w.videoId)+'"></video>';
      }else{
        cover = '<div class="card__bg" style="background:'+w.gradient+'"></div><span class="card__glyph">'+esc((w.title||"·").charAt(0))+'</span>';
      }
      return '<article class="card" data-id="'+w.id+'" tabindex="0" role="button" aria-label="播放 '+esc(w.title)+'" style="--d:'+(i*70)+'ms">'+
        '<div class="card__cover">'+
          cover+
          '<span class="card__num">'+pad(i+1)+'</span>'+
          '<span class="card__platform">'+plabel(w)+'</span>'+
          '<span class="card__play" aria-hidden="true"><i></i></span>'+
        '</div>'+
        '<div class="card__body">'+
          '<h3 class="card__title">'+esc(w.title)+'</h3>'+
          '<div class="card__meta">'+esc(w.category)+(w.year?" · "+w.year:"")+'</div>'+
        '</div>'+
      '</article>';
    }).join("");
    Array.prototype.forEach.call(gridEl.querySelectorAll(".card"),function(card){
      var id = card.getAttribute("data-id");
      var w = WORKS.filter(function(x){return x.id===id;})[0];
      card.addEventListener("click",function(){ if(w) openModal(w); });
      card.addEventListener("keydown",function(e){
        if(e.key==="Enter" || e.key===" "){ e.preventDefault(); if(w) openModal(w); }
      });
    });
    initCovers();
  }

  /* 本地视频封面：seek 到视频自身更具代表性的画面（避开黑场开头，仍用视频真实帧） */
  function initCovers(){
    Array.prototype.forEach.call(gridEl.querySelectorAll(".card__video"),function(v){
      var seeked=false;
      function showFrame(){
        if(seeked) return; seeked=true;
        try{
          var d = isFinite(v.duration) && v.duration>0 ? v.duration : 4;
          v.currentTime = Math.min(2, Math.max(0.5, d*0.08));
        }catch(e){}
      }
      v.addEventListener("loadedmetadata",showFrame);
      v.addEventListener("loadeddata",showFrame);
    });
  }

  /* ============ 模态框 ============ */
  var modal=document.getElementById("modal"), frame=document.getElementById("modalFrame");
  var dialog=modal.querySelector(".modal__dialog");
  var lastFocused=null;
  var polyvInstance=null, polyvQueue=[], polyvLoading=false;
  function loadPolyv(cb){
    if(window.polyvPlayer){ if(cb) cb(); return; }
    if(cb) polyvQueue.push(cb);
    if(polyvLoading) return;
    polyvLoading=true;
    var s=document.createElement("script");
    s.src="https://player.polyv.net/resp/vod-player/latest/player.js";
    s.onload=function(){ polyvLoading=false; var q=polyvQueue.splice(0); q.forEach(function(f){try{f();}catch(e){}}); };
    s.onerror=function(){ polyvLoading=false; };
    document.head.appendChild(s);
  }
  function openModal(w){
    currentOpenId = w.id;
    lastFocused = document.activeElement;
    frame.classList.remove("is-portrait");
    frame.style.width = ""; frame.style.height = "";
    dialog.style.width = "";
    if(w.platform==="local"){
      var mv=document.createElement("video");
      mv.src=w.videoId; mv.controls=true; mv.autoplay=true; mv.playsInline=true;
      mv.setAttribute("playsinline","");
      mv.setAttribute("webkit-playsinline","");
      frame.appendChild(mv);
      mv.addEventListener("loadedmetadata",function(){
        if(mv.videoHeight > mv.videoWidth){
          var h = Math.min(window.innerHeight*0.78, 660);
          frame.classList.add("is-portrait");
          frame.style.height = h+"px";
          frame.style.width = Math.round(h * mv.videoWidth / mv.videoHeight)+"px";
          dialog.style.width = frame.style.width;
        }
      });
      var pp=mv.play(); if(pp&&pp.catch) pp.catch(function(){});
    }else if(w.platform==="polyv"){
      frame.innerHTML = '<div id="polyvHost" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#8a8a82;font-size:13px;letter-spacing:.08em">播放器加载中…</div>';
      if(w.portrait){
        var ph = Math.min(window.innerHeight*0.78, 660);
        var pr = w.ratio || 0.75;
        var pw = Math.round(ph*pr);
        var maxW = window.innerWidth - 32;
        if(pw > maxW){ pw = maxW; ph = Math.round(pw/pr); }
        frame.classList.add("is-portrait");
        frame.style.height = ph+"px";
        frame.style.width = pw+"px";
        dialog.style.width = pw+"px";
      }
      loadPolyv(function(){
        try{
          var host=document.getElementById("polyvHost");
          if(host) host.innerHTML="";
          polyvInstance = window.polyvPlayer({
            domainInfo:{player:"player.polyv.net"},
            wrap:"#polyvHost",
            vid:w.videoId,
            width:"100%", height:"100%",
            forceH5:true, playsafe:"",
            flashvars:{autoplay:"1", df:"", p:"1", playsafe:""}
          });
        }catch(e){}
      });
    }else{
      frame.innerHTML = '<iframe src="'+embed(w)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
    }
    document.getElementById("modalTitle").textContent = w.title;
    document.getElementById("modalSub").textContent = [w.category,w.client,w.year].filter(Boolean).join(" · ");
    modal.classList.add("is-open"); modal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
    var cb=modal.querySelector(".modal__close");
    if(cb){ try{ cb.focus({preventScroll:true}); }catch(e){} }
  }
  function closeModal(){
    modal.classList.remove("is-open"); modal.setAttribute("aria-hidden","true");
    document.body.style.overflow=""; frame.innerHTML=""; currentOpenId=null;
    try{ if(polyvInstance && polyvInstance.destroy) polyvInstance.destroy(); }catch(e){}
    polyvInstance=null;
    frame.classList.remove("is-portrait");
    frame.style.width=""; frame.style.height="";
    dialog.style.width="";
    if(lastFocused && lastFocused.focus){ try{ lastFocused.focus({preventScroll:true}); }catch(e){} }
  }
  Array.prototype.forEach.call(modal.querySelectorAll("[data-close]"),function(el){el.addEventListener("click",closeModal);});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});

  /* ============ 滚动 ============ */
  var nav=document.getElementById("nav");
  window.addEventListener("scroll",function(){nav.classList.toggle("scrolled",window.scrollY>20);},{passive:true});

  /* ============ 初始化（先渲染，再挂观察器） ============ */
  current = ALL_CAT;
  renderFilters();
  updateCount();
  render();

  /* 预加载保利威播放器：SDK 约 900KB，提前拉取避免点开时黑屏等待 */
  if(WORKS.some(function(w){return w.platform==="polyv";})){
    setTimeout(function(){ loadPolyv(); }, 1200);
  }

  /* ============ 进场动画 ============ */
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});
    },{threshold:.12});
    Array.prototype.forEach.call(document.querySelectorAll(".reveal"),function(el){io.observe(el);});
    // 兜底：观察器在部分环境可能漏触发，1.2s 后把视口内的元素直接显示
    setTimeout(function(){
      Array.prototype.forEach.call(document.querySelectorAll(".reveal:not(.in)"),function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight && r.bottom>0) el.classList.add("in");
      });
    },1200);
  }else{
    Array.prototype.forEach.call(document.querySelectorAll(".reveal"),function(el){el.classList.add("in");});
  }
})();
</script>
